name: Crear APK Terra Vida

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip gradle-8.7-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Extraer proyecto
        run: |
          unzip -o TerraVida.zip -d proyecto
          FILE=$(find proyecto -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          test -n "$FILE"
          echo "PROJECT_DIR=$(dirname "$FILE")" >> $GITHUB_ENV

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TerraVida-APK
          path: proyecto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
